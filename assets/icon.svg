<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2c2275"/>
      <stop offset="55%" stop-color="#16123f"/>
      <stop offset="100%" stop-color="#0b0a24"/>
    </radialGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#ff006e"/>
    </linearGradient>
    <linearGradient id="cyan" gradientUnits="userSpaceOnUse" x1="0" y1="13" x2="0" y2="67">
      <stop offset="0%" stop-color="#7ff6ff"/>
      <stop offset="100%" stop-color="#00a6e6"/>
    </linearGradient>
    <linearGradient id="violet" gradientUnits="userSpaceOnUse" x1="0" y1="13" x2="0" y2="67">
      <stop offset="0%" stop-color="#a990ff"/>
      <stop offset="100%" stop-color="#5233e0"/>
    </linearGradient>
    <linearGradient id="magenta" gradientUnits="userSpaceOnUse" x1="0" y1="13" x2="0" y2="67">
      <stop offset="0%" stop-color="#ff6fb1"/>
      <stop offset="100%" stop-color="#d6005a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="80" height="80" fill="url(#bg)"/>
  <!-- Neon halo behind the tribar -->
  <polygon points="18.12,17.5 18.12,62.5 25.91,67 64.88,44.5 64.88,35.5 25.91,13" fill="url(#halo)" opacity="0.45" filter="url(#glow)"/>
  <!-- Impossible (Penrose) tribar shaped as a play button: an endless stream -->
  <polygon points="25.91,13 33.71,17.5 64.88,35.5 64.88,44.5 33.71,26.5 33.71,44.5 25.91,49" fill="url(#violet)"/>
  <polygon points="18.12,17.5 18.12,62.5 49.29,44.5 41.5,40 25.91,49 25.91,13" fill="url(#cyan)"/>
  <polygon points="25.91,67 64.88,44.5 33.71,26.5 33.71,35.5 49.29,44.5 18.12,62.5" fill="url(#magenta)"/>
  <polygon points="33.71,35.5 33.71,44.5 41.5,40" fill="#0c0a26"/>
</svg>
