<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
  <title>iPlayer</title>
  <script>
    // Anti-FOUC (Flash of Unstyled Content): apply the saved theme before first paint.
    // StorageService JSON-encodes values, so the stored id is a quoted string.
    try { var t = JSON.parse(localStorage.getItem('iptv_theme')); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    try { var s = JSON.parse(localStorage.getItem('iptv_text_size')); if (s) document.documentElement.dataset.textSize = s; } catch (e) {}
    try { var a = JSON.parse(localStorage.getItem('iptv_animation_mode')); if (a) document.documentElement.dataset.animation = a; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/legacy-webos-base.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/channel-list.css">
  <link rel="stylesheet" href="css/live-preview.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/epg.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/reminder-manager.css">
  <link rel="stylesheet" href="css/tab-bar.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/catalog-view.css">
  <link rel="stylesheet" href="css/account-switcher.css">
  <link rel="stylesheet" href="css/parental-controls.css">
  <link rel="stylesheet" href="css/live-category-picker.css">
  <link rel="stylesheet" href="css/legacy-webos-overrides.css">
</head>
<body>
  <video id="video-player" autoplay></video>

  <div id="view-loading" class="view">
    <div class="loading-container">
      <div class="splash-brand" aria-hidden="true">
        <svg class="app-logo splash-logo" viewBox="15.85 14 55.5 52">
          <path class="app-logo-play splash-play" d="M19 18.6v7.8l6.6-3.9z" stroke-width="3.6" stroke-linejoin="round"/>
          <rect class="app-logo-letter" x="17.4" y="32.5" width="8.5" height="30" rx="4.25"/>
          <path class="app-logo-letter" d="M36.63 62.5C39.3 62.5 40.87 60.87 40.87 58.1V49.21H48.44C56.97 49.21 62.88 43.65 62.88 35.35C62.88 27.02 57.16 21.5 48.86 21.5H36.63C33.97 21.5 32.4 23.13 32.4 25.9V58.1C32.4 60.87 33.97 62.5 36.63 62.5ZM40.87 42.59V28.2H46.62C51.47 28.2 54.27 30.78 54.27 35.38C54.27 40.01 51.44 42.59 46.59 42.59Z"/>
          <path class="app-logo-tv" d="M48.94 62.65C49.71 62.65 50.16 62.19 50.16 61.38V54.87H51.85C52.49 54.87 52.93 54.51 52.93 53.88C52.93 53.26 52.51 52.9 51.85 52.9H46.04C45.38 52.9 44.95 53.26 44.95 53.88C44.95 54.51 45.39 54.87 46.04 54.87H47.72V61.38C47.72 62.19 48.17 62.65 48.94 62.65ZM58.4 62.65C59.39 62.65 59.99 62.19 60.36 61.16L62.76 54.54C62.84 54.32 62.88 54.12 62.88 53.89C62.88 53.21 62.37 52.75 61.62 52.75C60.97 52.75 60.59 53.05 60.41 53.7L58.48 60.11H58.43L56.49 53.73C56.29 53.06 55.9 52.75 55.22 52.75C54.45 52.75 53.93 53.23 53.93 53.93C53.93 54.18 53.97 54.4 54.05 54.62L56.43 61.16C56.8 62.19 57.39 62.65 58.4 62.65Z"/>
          <path class="app-logo-signal splash-arc" d="M65.89 25.6A19.5 19.5 0 0 1 65.89 45.1" fill="none" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="splash-wordmark">iPlayer</div>
      </div>
      <div class="splash-progress"><div class="splash-progress-bar"></div></div>
      <div id="loading-text" class="loading-text" role="status" aria-live="polite">Loading…</div>
    </div>
  </div>

  <div id="view-channels" class="view hidden">
    <div id="channel-browser"></div>
    <aside id="live-preview" class="hidden"></aside>
  </div>

  <div id="view-player" class="view hidden">
    <div id="player-sidebar" class="player-sidebar hidden"></div>
    <div id="player-menu" class="player-menu hidden"></div>
    <div id="player-osd" class="player-osd hidden"></div>
    <time class="osd-clock hidden"></time>
    <div id="subtitle-search" class="hidden"></div>
    <div id="subtitle-offset" class="hidden"></div>
  </div>

  <div id="view-epg" class="view hidden"></div>

  <div id="view-settings" class="view hidden"></div>
  <div id="view-parental-controls" class="view hidden"></div>
  <div id="view-reminders" class="view hidden"></div>

  <div id="view-movies" class="view hidden"></div>
  <div id="view-series" class="view hidden"></div>
  <div id="view-search" class="view hidden"></div>

  <!-- preview-libs -->
  <script src="js/app.js"></script>
</body>
</html>
