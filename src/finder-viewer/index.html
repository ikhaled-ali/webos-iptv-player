<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f7fb">
<title>Signal finder</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #fff;
    --text: #1a2138;
    --muted: #5d6680;
    --border: #dce2ed;
    --track: #e8ecf4;
    --accent: #4c7eff;
    --good: #1a8a4a;
    --fair: #b86e00;
    --poor: #c43b4d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131c;
      --card: #1a1f2b;
      --text: #eef1f8;
      --muted: #a3abc2;
      --border: #2c3344;
      --track: #2a3040;
      --accent: #7a9dff;
      --good: #3ccf7a;
      --fair: #f0a530;
      --poor: #ff6b7d;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 520px; margin: 0 auto; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  .lock {
    flex: 0 0 auto;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--muted);
  }
  .lock[data-state="locked"] { background: var(--good); }
  .lock[data-state="nolock"] { background: var(--poor); }
  .card {
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  .card + .card { margin-top: 12px; }
  .notice {
    margin: 0 0 12px;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 15px;
    color: var(--text);
    background: var(--track);
  }
  .meter + .meter { margin-top: 20px; }
  .meter-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .meter-label { font-size: 15px; color: var(--muted); }
  .meter-value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .meter.primary .meter-value { font-size: 56px; line-height: 1; }
  .bar {
    position: relative;
    height: 14px;
    overflow: hidden;
    border-radius: 7px;
    background: var(--track);
  }
  .meter.primary .bar { height: 22px; border-radius: 11px; }
  .bar-fill {
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: var(--muted);
    transition: width 0.3s ease-out;
  }
  .meter[data-level="good"] .bar-fill { background: var(--good); }
  .meter[data-level="fair"] .bar-fill { background: var(--fair); }
  .meter[data-level="poor"] .bar-fill { background: var(--poor); }
  .peak-mark {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 3px;
    margin-left: -1px;
    background: var(--text);
  }
  .facts { margin: 0; font-size: 15px; }
  .facts div { display: flex; justify-content: space-between; gap: 16px; }
  .facts div + div { margin-top: 10px; }
  .facts dt { color: var(--muted); }
  .facts dd {
    min-width: 0;
    margin: 0;
    overflow: hidden;
    text-align: right;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .controls { display: flex; gap: 12px; margin-top: 12px; }
  button {
    flex: 1;
    min-height: 48px;
    padding: 0 16px;
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
  }
  button[aria-pressed="true"] { color: #fff; background: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
  .stale .meters { opacity: 0.45; }
  .tuning { margin-top: 12px; }
  fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
  fieldset:disabled { opacity: 0.45; }
  .field { display: block; }
  .field + .field, .field + .pair, .pair + .field { margin-top: 16px; }
  .field-label { display: block; margin-bottom: 6px; font-size: 15px; color: var(--muted); }
  select, input[type="text"] {
    display: block;
    width: 100%;
    min-height: 48px;
    padding: 0 12px;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  input[type="text"] { font-variant-numeric: tabular-nums; }
  input[aria-invalid="true"] { border-color: var(--poor); }
  .pair { display: flex; gap: 12px; }
  .pair .field { flex: 1; min-width: 0; margin-top: 0; }
  .segmented { display: flex; gap: 8px; }
  .segmented button { min-width: 0; padding: 0 8px; }
  .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .switch-row .field-label { margin: 0; }
  .switch {
    position: relative;
    flex: 0 0 auto;
    width: 52px;
    height: 32px;
    margin: 0;
    border-radius: 16px;
    background: var(--track);
    border: 1px solid var(--border);
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
  }
  .switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    transition: transform 0.15s ease-out;
  }
  .switch:checked { background: var(--accent); border-color: var(--accent); }
  .switch:checked::after { transform: translateX(20px); }
  .send-status { margin: 16px 0 0; font-size: 15px; color: var(--muted); }
  .send-status[data-error="true"] { color: var(--poor); }
</style>
</head>
<body>
<main id="app">
  <header>
    <h1 id="title">Signal finder</h1>
    <span class="lock" id="lock" data-state="searching" hidden></span>
  </header>
  <p class="notice" id="notice"></p>
  <section class="card meters">
    <div class="meter primary" id="quality" data-level="none">
      <div class="meter-top">
        <span class="meter-label" data-label="quality"></span>
        <span class="meter-value">–</span>
      </div>
      <div class="bar"><div class="bar-fill"></div><div class="peak-mark" hidden></div></div>
    </div>
    <div class="meter" id="strength" data-level="none">
      <div class="meter-top">
        <span class="meter-label" data-label="strength"></span>
        <span class="meter-value">–</span>
      </div>
      <div class="bar"><div class="bar-fill"></div></div>
    </div>
  </section>
  <section class="card">
    <dl class="facts">
      <div><dt data-label="peak"></dt><dd id="peak">–</dd></div>
      <div><dt data-label="ber"></dt><dd id="ber">–</dd></div>
      <div><dt data-label="transponder"></dt><dd id="transponder">–</dd></div>
    </dl>
  </section>
  <div class="controls">
    <button type="button" id="sound" aria-pressed="false" data-label="sound"></button>
    <button type="button" id="reset" data-label="resetPeak"></button>
  </div>
  <section class="card tuning" id="tuning" hidden>
    <fieldset id="tuning-fields">
      <label class="field"><span class="field-label" data-label="satellite"></span><select id="f-satellite"></select></label>
      <label class="field"><span class="field-label" data-label="lnb"></span><select id="f-lnb"></select></label>
      <div class="field"><span class="field-label" data-label="diseqc"></span><div class="segmented" id="f-diseqc"></div></div>
      <div class="field"><span class="field-label" data-label="tone"></span><div class="segmented" id="f-tone"></div></div>
      <label class="field switch-row">
        <span class="field-label" data-label="lnbPower"></span>
        <input type="checkbox" class="switch" id="f-power" role="switch">
      </label>
      <label class="field"><span class="field-label" data-label="transponder"></span><select id="f-tp"></select></label>
      <div class="pair">
        <label class="field" id="f-frequency-field">
          <span class="field-label" data-label="frequency"></span>
          <input id="f-frequency" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off">
        </label>
        <label class="field">
          <span class="field-label" data-label="symbolRate"></span>
          <input id="f-symbol-rate" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off">
        </label>
      </div>
      <div class="field"><span class="field-label" data-label="polarization"></span><div class="segmented" id="f-pol"></div></div>
      <div class="field"><span class="field-label" data-label="system"></span><div class="segmented" id="f-system"></div></div>
    </fieldset>
    <p class="send-status" id="send-status" role="status" hidden></p>
    <div class="controls">
      <button type="button" id="cancel" data-label="cancel" hidden></button>
      <button type="button" id="send" class="primary" data-label="send"></button>
    </div>
  </section>
</main>
<!-- VIEWER_SCRIPT -->
</body>
</html>
